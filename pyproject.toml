[tool.uv.workspace]
members = [
  "packages/rai-check-core",
  "packages/rai-check-ml",
  "packages/rai-check-dl",
  "packages/rai-check-genai",
  "packages/rai-check-kit",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = [
  "packages/rai-check-core/src",
  "packages/rai-check-ml/src",
  "packages/rai-check-genai/src",
  "packages/rai-check-dl/src",
  "packages/rai-check-kit/src",
]
testpaths = [
  "packages/rai-check-core/tests",
  "packages/rai-check-ml/tests",
  "packages/rai-check-genai/tests",
  "packages/rai-check-dl/tests",
  "packages/rai-check-kit/tests",
]
