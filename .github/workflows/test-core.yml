name: Test rai-check-core

on:
  push:
    branches:
      - main
    paths:
      - "packages/rai-check-core/**"
      - ".github/workflows/test-core.yml"
  pull_request:
    paths:
      - "packages/rai-check-core/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv venv
      - run: uv pip install -e "packages/rai-check-core" pytest
      - run: uv run pytest packages/rai-check-core/tests -v
